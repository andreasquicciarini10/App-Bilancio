*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:flex;min-height:100vh}.sidebar{width:232px;background:#fff;border-right:1px solid var(--line);padding:28px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;margin:0 8px 38px;font-size:21px;font-weight:800;letter-spacing:-.8px}.brandlogo{width:34px;height:34px;border-radius:12px;background:var(--teal);display:grid;place-items:center;color:white;font-size:20px}.navitem{display:flex;align-items:center;width:100%;gap:12px;border:0;padding:12px 14px;border-radius:12px;text-align:left;background:transparent;color:#6c7886;font-weight:600;margin:3px 0}.navitem:hover,.navitem.active{background:#e6f4f1;color:var(--deep)}.navitem .glyph{font-size:18px;width:24px;text-align:center}.sidefoot{margin-top:auto;border-radius:14px;padding:14px;background:#f1f6f5;color:#5c6d77;font-size:12px;line-height:1.5}.stage{width:100%;min-width:0;max-width:1260px;margin:auto;padding:30px 42px 100px}.topline{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:26px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:750;color:var(--teal)}h1{font-size:30px;letter-spacing:-1.1px;line-height:1.12;margin:8px 0 7px;font-weight:800}h2{font-size:18px;letter-spacing:-.4px;margin:0}h3{font-size:14px;margin:0;font-weight:750}.subtitle{color:var(--muted);font-size:13px;margin:0}.controls{display:flex;gap:10px;align-items:center}.monthnav{display:flex;align-items:center;gap:4px;background:white;border:1px solid var(--line);border-radius:12px;padding:5px;white-space:nowrap}.monthnav button{background:none;border:0;border-radius:8px;width:30px;height:30px;font-size:21px;color:#7b8792}.monthnav button:hover{background:#edf2f3}.monthnav strong{font-size:13px;m nowrap;overflow:hidden;text-overflow:ellipsis}.movement .middle small{display:block;color:var(--muted);margin-top:4px}.movement .right{font-size:14px;font-weight:800;text-align:right;white-space:nowrap}.movement .actions{display:flex;gap:4px;margin-left:4px}.iconbtn{border:0;background:#f5f7f9;color:#718094;width:30px;height:30px;border-radius:8px}.iconbtn:hover{background:#e5eded}.proposed{background:#f7faf9;border:1px solid #e4efec;border-radius:13px;padding:13px;margin:10px 0}.proposed .phead{display:flex;gap:10px;align-items:center}.proposed .phead .middle{flex:1;min-width:0}.proposed .phead .middle strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.proposed .phead .middle small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.proposed .phead .right{font-size:13px;font-weight:800;white-space:nowrap;text-align:right}.proposed .pcontrols{display:flex;justify-content:flex-end;gap:7px;margin-top:11px}.chip{display:inline-flex;align-items:center;background:#ebf6f3;color:#15786f;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.warningchip{background:#fff3e4;color:#a66d21}.sectiontitle{margin:26px 0 15px;display:flex;align-items:center;justify-content:space-between}.hero{background:linear-gradient(118deg,#0a726e,#124d54);color:#fff;border-radius:19px;padding:26px;display:flex;justify-content:space-between;gap:18px;align-items:center;box-shadow:0 12px 25px rgba(10,99,93,.12)}.hero .hlabel{font-size:13px;opacity:.75}.hero .hnum{font-size:36px;letter-spacing:-1.3px;font-weight:850;margin:8px 0}.hero .secondary{font-size:12px;opacity:.88}.heroicon{font-size:36px;opacity:.8}.notice{font-size:12px;color:#68788a;line-height:1.6}.input,.select{width:100%;border:1px solid #dfe6eb;background:white;color:var(--ink);border-radius:11px;padding:11px 12px;min-height:43px;outline:none}.input:focus,.select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,141,128,.12)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formfield{display:flex;flex-direction:column;gap:7px}.formfield label{font-size:12px;color:#566779;font-weight:750}.formactions{display:flex;justify-content:flex-end;gap:10px;padding-top:8px}.searchbar{display:flex;gap:8px;margin-bottom:14px}.searchbar .input{flex:1}.emptystate{padding:35px 12px;text-align:center;color:var(--muted);font-size:13px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.statbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.statbar .caption{width:75px;flex-shrink:0;font-size:12px;color:#657184}.statbar .value{min-width:65px;text-align:right;font-size:12px;font-weight:700}.trendrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}.trendrow .mon{width:45px;color:#647487;font-size:12px}.trendtrack{flex:1;background:#eef3f4;border-radius:6px;min-width:10px;height:18px;overflow:hidden}.trendfill{background:#65a59c;height:100%}.trendrow b{width:80px;text-align:right;font-size:12px}.budgetline{margin-bottom:17px}.budgetline .cathead{margin-bottom:9px}.budgetitem{display:grid;grid-template-columns:1fr 135px auto;align-items:center;gap:12px;border-top:1px solid var(--line);padding:14px 0}.budgetitem:first-child{border:0}.kpi{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.kpi .number{font-size:22px;letter-spacing:-.5px;font-weight:800}.settingsrow{border-bottom:1px solid var(--line);padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.settingsrow:last-child{border:0}.settingsrow strong{display:block;font-size:13px;margin-bottom:4px}.settingsrow small{color:var(--muted)}.modalback{position:fixed;inset:0;z-index:50;background:rgba(17,32,42,.53);display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(500px,100%);max-height:95dvh;overflow:auto;border-radius:21px;background:#fff;padding:24px;box-shadow:0 35px 80px rgba(0,0,0,.22)}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modalhead h2{font-size:20px}.modal .formgrid{gap:15px}.toggle{display:flex;gap:8px;margin-bottom:17px}.toggle button{background:#eef2f4;border:none;color:#627082;font-weight:800;border-radius:10px;padding:10px 16px;flex:1}.toggle button.active{background:#e6f5f1;color:#07796d}.bottomnav{display:none}.notification{background:#fff8e9;border:1px solid #f3e8d0;border-radius:12px;padding:13px;color:#8f681e;font-size:12px;margin:0 0 18px}.mt{margin-top:16px}.mt24{margin-top:24px}.inlinehint{font-size:12px;color:var(--muted);margin:8px 0}.version{color:#8b9aab;font-size:11px}.checkrow{display:flex;gap:8px;align-items:center;font-size:13px}.checkrow input{accent-color:var(--teal)}
@media(max-width:950px){.stage{padding:27px 22px 96px}.sidebar{width:200px}.split{grid-template-columns:1fr}.cards3{gap:12px}.tile{padding:16px}}
@media(max-width:720px){.app{display:block}.sidebar{display:none}.stage{padding:22px 16px 108px}.topline{display:block}.topline .controls{margin-top:18px;justify-content:space-between}.topline .controls>.btn{display:none}.monthnav{width:100%;justify-content:space-between}.monthnav strong{min-width:unset}h1{font-size:27px}.cards3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cards3>.tile:last-child{grid-column:1/-1}.tile{padding:16px}.amount{font-size:24px}.grid,.split{gap:12px}.panel{padding:17px}.split,.twocol{grid-template-columns:1fr}.hero{padding:23px}.hero .hnum{font-size:31px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(70px + env(safe-area-inset-bottom,0px));padding:7px 9px calc(9px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:20;justify-content:space-around;backdrop-filter:blur(12px)}.bottomnav button{background:none;border:0;color:#84919c;min-width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:750;padding:3px 1px}.bottomnav button .glyph{font-size:21px}.bottomnav button.active{color:var(--teal)}.bottomnav .addnav .glyph{background:var(--teal);color:#fff;border-radius:16px;display:grid;place-items:center;height:42px;width:42px;font-size:29px;margin-top:-17px;box-shadow:0 5px 12px rgba(14,141,128,.2)}.formgrid{grid-template-columns:1fr}.budgetitem{grid-template-columns:1fr 110px;gap:9px}.budgetitem button{grid-column:2}.modal{padding:20px}.statbar .caption{width:64px}.version{display:none}}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar"><div class="brand"><span class="brandlogo">◈</span> Bilancio</div><nav id="sidenav"></nav><div class="sidefoot">🔒 <b>Prototipo locale</b><br/>I dati rimangono in questo browser. Non c'è ancora sincronizzazione tra dispositivi.</div></aside>
 <main class="stage"><div id="top"></div><div id="view"></div></main>
</div>
<div id="bottomnav" class="bottomnav"></div>
<div id="modalroot"></div>
<script>
(() => {"use strict";
const KEY='bilancio-demo-v1';
const now=new Date(); const pad=n=>String(n).padStart(2,'0');
const realMonth=now.getFullYear()+'-'+pad(now.getMonth()+1);
const day=(n,m=realMonth)=>m+'-'+pad(n);
const expenseCats=['Casa','Alimentari','Trasporti','Ristoranti','Svago','Shopping','Abbonamenti','Salute','Altro'];
const incomeCats=['Stipendio','Extra','Rimborsi','Regali','Altro'];
const emojis={'Casa':'⌂','Alimentari':'🛒','Trasporti':'🚗','Ristoranti':'🍽️','Svago':'🎟️','Shopping':'🛍️','Abbonamenti':'🎵','Salute':'✚','Altro':'◌','Stipendio':'💼','Extra':'✦','Rimborsi':'↩','Regali':'🎁'};
const money=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const safe=str=>String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDate=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
const monthLabel=m=>new Date(m+'-01T12:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
const base=()=>({demo:true,month:realMonth,transactions:[
 {id:'t1',type:'income',amount:1750,category:'Stipendio',title:'Stipendio',date:day(2)},
 {id:'t2',type:'expense',amount:450,category:'Casa',title:'Affitto',date:day(2)},
 {id:'t3',type:'expense',amount:63.40,category:'Alimentari',title:'Spesa settimanale',date:day(4)},
 {id:'t4',type:'expense',amount:35,category:'Trasporti',title:'Carburante',date:day(5)},
 {id:'t5',type:'expense',amount:29,category:'Ristoranti',title:'Cena fuori',date:day(7)},
 {id:'t6',type:'expense',amount:12.99,category:'Abbonamenti',title:'Streaming',date:day(8)}
 ],budgetGeneral:1200,budgetCats:{Alimentari:250,Trasporti:120,Svago:100},budgetOverrides:{},customExpense:[],customIncome:[],recurring:[
 {id:'r1',type:'income',title:'Rimborso spese',amount:50,category:'Rimborsi',day:27},
 {id:'r2',type:'expense',title:'Abbonamento musica',amount:10.99,category:'Abbonamenti',day:15}
 ],decisions:{}});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||base()}catch{state=base()}
let tab='home', filter='all', search='', editingType='expense';
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Non è possibile salvare i dati in questo browser. Usa un browser con archiviazione abilitata.')}};
const allCats=t=>t==='income'?[...incomeCats,...state.customIncome]:[...expenseCats,...state.customExpense];
const catsFor=t=>allCats(t).map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('');
const selected=()=>state.transactions.filter(x=>x.date.startsWith(state.month));
const totals=(m=state.month)=>{const arr=state.transactions.filter(x=>x.date.startsWith(m));return {income:arr.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),expense:arr.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0)}};
const budget=()=>state.budgetOverrides[state.month]||{general:state.budgetGeneral,cats:state.budgetCats};
const byCat=()=>{let obj={};selected().filter(x=>x.type==='expense').forEach(x=>obj[x.category]=(obj[x.category]||0)+Number(x.amount));return obj};
const href='#';
const nav=[['home','⌂','Home'],['transactions','▤','Movimenti'],['analytics','▥','Statistiche'],['budget','◉','Budget'],['settings','⚙','Impostazioni']];
const getRecurringPending=()=>state.recurring.filter(x=>!state.decisions[state.month+'_'+x.id]);
function render(){
 document.getElementById('sidenav').innerHTML=nav.map(([k,i,t])=>`<button class="navitem ${tab===k?'active':''}" data-action="tab" data-tab="${k}"><span class="glyph">${i}</span>${t}</button>`).join('');
 document.getElementById('bottomnav').innerHTML=`${nav.slice(0,2).map(([k,i,t])=>bottom(k,i,t)).join('')}<button class="addnav" data-action="add"><span class="glyph">+</span>Aggiungi</button>${nav.slice(2,4).map(([k,i,t])=>bottom(k,i,t)).join('')}<button data-action="tab" data-tab="settings" class="${tab==='settings'?'active':''}"><span class="glyph">⚙</span>Altro</button>`;
 const labels={home:'Panoramica',transactions:'Movimenti',analytics:'Statistiche',budget:'Budget',settings:'Impostazioni'};
 document.getElementById('top').innerHTML=`<div class="topline"><div><div class="eyebrow">${state.demo?'Modalità dimostrativa':'I tuoi dati locali'}</div><h1>${labels[tab]}</h1><p class="subtitle">${tab==='home'?'Tieni tutto sotto controllo, un mese alla volta.':tab==='analytics'?'Scopri come cambiano le tue abitudini.':tab==='budget'?'Pianifica le spese, senza sorprese.':tab==='settings'?'Personalizza il tuo spazio finanziario.':'Ogni movimento, al suo posto.'}</p></div><div class="controls"><div class="monthnav"><button title="Mese precedente" data-action="prevmonth">‹</button><strong>${safe(monthLabel(state.month))}</strong><button title="Mese successivo" data-action="nextmonth">›</button></div><button class="btn" data-action="add">+ Nuovo movimento</button></div></div>`;
 const renderer={home:renderHome,transactions:renderTransactions,analytics:renderAnalytics,budget:renderBudget,settings:renderSettings};
 document.getElementById('view').innerHTML=renderer[tab]();
 if(tab==='transactions')applySearch();
}
function bottom(k,i,t){return `<button class="${tab===k?'active':''}" data-action="tab" data-tab="${k}"><span class="glyph">${i}</span>${t}</button>`}
function mrow(x,editable=false){return `<div class="movement"><div class="symbol">${emojis[x.category]||'◌'}</div><div class="middle"><strong>${safe(x.title||x.category)}</strong><small>${safe(x.category)} · ${formatDate(x.date)}</small></div><div class="right ${x.type==='income'?'positive':''}">${x.type==='income'?'+':'−'} ${money(x.amount)}</div>${editable?`<div class="actions"><button class="iconbtn" title="Modifica" data-action="edit" data-id="${safe(x.id)}">✎</button><button class="iconbtn" title="Elimina" data-action="delete" data-id="${safe(x.id)}">×</button></div>`:''}</div>`}
function progress(used,max){const p=max>0?used/max*100:0;return `<div class="barouter"><div class="barfill ${p>100?'over':p>=85?'warn':''}" style="width:${Math.min(100,p).toFixed(2)}%"></div></div>`}
function renderHome(){const t=totals(),saving=t.income-t.expense,b=budget(),cat=byCat(),lim=Number(b.general)||0,remaining=lim-t.expense,arr=[...selected()].sort((a,b)=>b.date.localeCompare(a.date)),pending=getRecurringPending();return `
<div class="hero"><div><div class="hlabel">Risparmio di ${safe(monthLabel(state.month))}</div><div class="hnum">${saving>=0?'+ ':''}${money(saving)}</div><div class="secondary">Entrate meno uscite confermate · ${t.income?((saving/t.income)*100).toFixed(1).replace('.',',')+'% delle entrate':'Nessuna entrata registrata'}</div></div><div class="heroicon">↗</div></div>
<div class="grid cards3 mt"><div class="tile"><div class="lab">↙ Entrate del mese</div><div class="amount positive">${money(t.income)}</div><div class="tiny">Incassi registrati</div></div><div class="tile"><div class="lab">↗ Uscite del mese</div><div class="amount">${money(t.expense)}</div><div class="tiny">Spese registrate</div></div><div class="tile"><div class="lab">◉ Budget residuo</div><div class="amount ${lim>0&&remaining<0?'negative':''}">${lim?money(remaining):'Da impostare'}</div>${progress(t.expense,lim)}<div class="tiny mt">${lim?money(t.expense)+' di '+money(lim):'Imposta il tuo budget'}</div></div></div>
${state.demo?`<div class="notification mt">✦ Stai visualizzando <b>dati inventati</b>. Puoi provarli liberamente oppure scegliere “Inizia da zero” nelle Impostazioni.</div>`:''}
<div class="split"><section class="panel"><div class="sectionrow"><h2>Spese per categoria</h2><button class="btn small alt" data-action="tab" data-tab="analytics">Analizza →</button></div>${Object.keys(cat).length?Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([name,v])=>`<div class="catrow"><div class="cathead"><strong>${emojis[name]||'◌'} ${safe(name)}</strong><span><strong>${money(v)}</strong> <small>· ${t.expense?(v/t.expense*100).toFixed(0):0}%</small></span></div>${progress(v,Math.max(t.expense,1))}</div>`).join(''):'<div class="emptystate">Nessuna uscita registrata in questo mese.</div>'}</section>
<section class="panel"><div class="sectionrow"><h2>Da confermare</h2><span class="chip ${pending.length?'warningchip':''}">${pending.length} ricorrenze</span></div>${pending.length?pending.map(r=>`<div class="proposed"><div class="phead"><div class="symbol">${emojis[r.category]||'↻'}</div><div class="middle"><strong>${safe(r.title)}</strong><small>Ogni ${r.day} del mese</small></div><div class="right ${r.type==='income'?'positive':''}">${r.type==='income'?'+':'−'} ${money(r.amount)}</div></div><div class="pcontrols"><button class="btn alt small" data-action="skiprec" data-id="${r.id}">Salta</button><button class="btn alt small" data-action="confirmrec" data-id="${r.id}" data-edit="yes">Modifica</button><button class="btn small" data-action="confirmrec" data-id="${r.id}">Conferma</button></div></div>`).join(''):'<div class="emptystate">Tutte le ricorrenze del mese sono state gestite. ✓</div>'}<p class="notice">Le ricorrenze non vengono conteggiate finché non le confermi. Puoi anche modificarne l'importo.</p></section></div>
<section class="panel mt"><div class="sectionrow"><h2>Ultimi movimenti</h2><button class="btn small alt" data-action="tab" data-tab="transactions">Vedi tutti →</button></div>${arr.length?arr.slice(0,5).map(x=>mrow(x)).join(''):'<div class="emptystate">Nessun movimento in questo mese. Usa il pulsante “+” per iniziare.</div>'}</section>`}
function renderTransactions(){const arr=[...selected()].sort((a,b)=>b.date.localeCompare(a.date));return `<section class="panel"><div class="sectionrow"><h2>Storico del mese <span class="tiny">(${arr.length})</span></h2><button class="btn light small" data-action="add">+ Aggiungi</button></div><div class="searchbar"><input id="search" class="input" placeholder="Cerca descrizione o categoria…" aria-label="Cerca movimenti" value="${safe(search)}"/><select id="filter" class="select" style="width:142px" aria-label="Filtra movimento"><option value="all" ${filter==='all'?'selected':''}>Tutti</option><option value="income" ${filter==='income'?'selected':''}>Entrate</option><option value="expense" ${filter==='expense'?'selected':''}>Uscite</option></select></div><div id="movementlist">${arr.map(x=>mrow(x,true)).join('')}</div><div id="noresults" class="emptystate" style="display:none">Nessun movimento corrisponde ai filtri.</div><p class="notice">Puoi modificare o cancellare ogni movimento. I totali e i budget si aggiornano automaticamente.</p></section>`}
function applySearch(){let count=0;document.querySelectorAll('#movementlist .movement').forEach(el=>{const v=el.textContent.toLowerCase();const id=el.querySelector('[data-action="edit"]')?.dataset.id;const x=state.transactions.find(t=>t.id===id);const show=v.includes(search.toLowerCase())&&(filter==='all'||x?.type===filter);el.style.display=show?'':'none';if(show)count++});const e=document.getElementById('noresults');if(e)e.style.display=count?'none':'block'}
function renderAnalytics(){const t=totals(),cat=byCat(),months=Array.from({length:6},(_,i)=>shiftMonth(state.month,i-5)),trend=months.map(m=>({...totals(m),m})),max=Math.max(1,...trend.flatMap(x=>[x.income,x.expense]));return `<div class="grid cards3"><div class="tile"><div class="lab">Entrate</div><div class="amount positive">${money(t.income)}</div></div><div class="tile"><div class="lab">Uscite</div><div class="amount">${money(t.expense)}</div></div><div class="tile"><div class="lab">Tasso di risparmio</div><div class="amount">${t.income?((t.income-t.expense)/t.income*100).toFixed(1).replace('.',',')+'%':'—'}</div></div></div><div class="twocol mt"><section class="panel"><div class="sectionrow"><h2>Andamento ultimi 6 mesi</h2></div><div class="tiny" style="margin-bottom:16px">Entrate <span class="positive">●</span> · Uscite <span class="negative">●</span></div>${trend.map(x=>`<div class="trendrow"><span class="mon">${new Date(x.m+'-01T12:00:00').toLocaleDateString('it-IT',{month:'short'})}</span><div class="trendtrack" title="Entrate ${money(x.income)}"><div class="trendfill" style="width:${x.income/max*100}%;background:#35a393"></div></div><div class="trendtrack" title="Uscite ${money(x.expense)}"><div class="trendfill" style="width:${x.expense/max*100}%;background:#de897c"></div></div><b>${money(x.income-x.expense)}</b></div>`).join('')}<p class="notice">I grafici includono soltanto i movimenti registrati.</p></section><section class="panel"><div class="sectionrow"><h2>Dove spendi di più</h2></div>${Object.keys(cat).length?Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="catrow"><div class="cathead"><strong>${emojis[c]||'◌'} ${safe(c)}</strong><small>${money(v)}</small></div>${progress(v,Math.max(1,t.expense))}</div>`).join(''):'<div class="emptystate">Nessuna spesa registrata.</div>'}</section></div>`}
function renderBudget(){const t=totals(),b=budget(),cat=byCat(),gen=Number(b.general)||0,cats=b.cats||{};const all=[...new Set([...allCats('expense'),...Object.keys(cats)])];return `<div class="grid cards2"><section class="panel"><div class="sectionrow"><h2>Budget generale</h2><span class="chip">${safe(monthLabel(state.month))}</span></div><div class="kpi"><div><div class="tiny">Uscite / limite mensile</div><div class="number">${money(t.expense)} <span class="tiny">/ ${money(gen)}</span></div></div><strong class="${gen>0&&gen-t.expense<0?'negative':'positive'}">${gen?money(gen-t.expense)+(gen-t.expense<0?' oltre budget':' residui'):'Nessun limite impostato'}</strong></div>${progress(t.expense,gen)}<div class="formfield mt"><label for="generalBudget">Imposta il budget del mese (€)</label><div style="display:flex;gap:8px"><input class="input" id="generalBudget" type="number" min="0" step="0.01" value="${gen}"/><button class="btn" data-action="savegeneral">Salva</button></div></div></section><section class="panel"><h2>Come funzionano i budget</h2><p class="notice" style="font-size:13px;margin:15px 0">Le categorie sono comprese nel limite generale: <b>non si sommano</b> al budget totale. Se una categoria non ha limite, continua comunque a contribuire al totale delle uscite.</p><p class="notice">I limiti valgono per il mese selezionato. All'inizio di un nuovo mese le spese ripartono da zero e vengono utilizzati i limiti predefiniti, salvo personalizzazioni.</p><button class="btn alt small" data-action="makeDefault">Usa questi limiti come predefiniti</button></section></div><section class="panel mt"><div class="sectionrow"><h2>Limiti per categoria</h2><span class="tiny">Facoltativi</span></div>${all.map(c=>{const v=Number(cat[c]||0),l=cats[c];return `<div class="budgetitem"><div><strong>${emojis[c]||'◌'} ${safe(c)}</strong><div class="tiny">${money(v)} spesi ${l!==undefined?'· '+money(l)+' di budget':'· nessun limite'}</div>${l!==undefined?`<div class="mt" style="max-width:440px">${progress(v,Number(l))}</div>`:''}</div><input class="input" type="number" step="0.01" min="0" data-limit="${safe(c)}" placeholder="Nessun limite" value="${l===undefined?'':l}"/><button class="btn small alt" data-action="savecat" data-cat="${safe(c)}">Salva</button></div>`}).join('')}</section>`}
function renderSettings(){const r=state.recurring;return `<div class="twocol"><section class="panel"><h2>Personalizzazione</h2><div class="settingsrow"><div><strong>Categorie di spesa</strong><small>Aggiungi una categoria personalizzata</small></div><button class="btn alt small" data-action="addcat" data-type="expense">+ Aggiungi</button></div><div class="settingsrow"><div><strong>Categorie di entrata</strong><small>Adatta le categorie alle tue esigenze</small></div><button class="btn alt small" data-action="addcat" data-type="income">+ Aggiungi</button></div><div class="settingsrow"><div><strong>Esporta movimenti CSV</strong><small>Copia di tutte le entrate e uscite</small></div><button class="btn alt small" data-action="export">Esporta</button></div><div class="settingsrow"><div><strong>Esporta backup JSON</strong><small>Per conservare una copia di sicurezza</small></div><button class="btn alt small" data-action="exportjson">Backup</button></div><div class="settingsrow"><div><strong>Importa backup JSON</strong><small>Ripristina i dati da un file esportato</small></div><label class="btn alt small" style="cursor:pointer">Importa<input id="importjson" type="file" accept=".json,application/json" style="display:none"/></label></div><div class="settingsrow"><div><strong>Inizia da zero</strong><small>Rimuove tutti i dati dimostrativi o locali</small></div><button class="btn danger small" data-action="reset">Azzera dati</button></div></section><section class="panel"><div class="sectionrow"><h2>Ricorrenze configurate</h2><button class="btn small light" data-action="addrec">+ Nuova</button></div>${r.length?r.map(x=>`<div class="movement"><div class="symbol">↻</div><div class="middle"><strong>${safe(x.title)}</strong><small>Giorno ${x.day} · ${safe(x.category)}</small></div><div class="right ${x.type==='income'?'positive':''}">${money(x.amount)}</div><button class="iconbtn" data-action="editrec" data-id="${x.id}" title="Modifica">✎</button><button class="iconbtn" data-action="delrec" data-id="${x.id}" title="Elimina">×</button></div>`).join(''):'<div class="emptystate">Non hai ricorrenze.</div>'}<p class="notice mt">Ogni mese le ricorrenze tornano tra quelle da confermare. Non incidono sui totali finché non confermi.</p><div class="notification mt">🔒 <b>Privacy del prototipo:</b> i dati sono conservati solo nel browser di questo dispositivo. Se cancelli i dati del sito, potresti perderli. Non inserire dati sensibili finché non avremo configurato una versione con backup e accesso protetto.</div><span class="version">Bilancio — prototipo v0.1 · offline, senza cloud</span></section></div>`}
function shiftMonth(m,n){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function openModal(html){document.getElementById('modalroot').innerHTML=`<div class="modalback" data-action="closeBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Editor movimento">${html}</div></div>`;document.querySelector('.modal input, .modal select')?.focus()}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
const modalHeader=(title)=>`<div class="modalhead"><h2>${safe(title)}</h2><button class="iconbtn" data-action="close" aria-label="Chiudi">✕</button></div>`;
function txnModal(x=null,recId=null){const type=x?.type||'expense';editingType=type;let dt=x?.date||((state.month===realMonth)?realMonth+'-'+pad(now.getDate()):state.month+'-01');openModal(`${modalHeader(x?'Modifica movimento':recId?'Conferma ricorrenza':'Nuovo movimento')}<div class="toggle"><button class="${type==='expense'?'active':''}" data-action="changeTxnType" data-type="expense">↗ Uscita</button><button class="${type==='income'?'active':''}" data-action="changeTxnType" data-type="income">↙ Entrata</button></div><form id="txnForm" data-id="${x?.id||''}" data-recid="${recId||''}" class="formgrid"><div class="formfield"><label for="txnAmt">Importo (€) *</label><input class="input" required id="txnAmt" type="number" inputmode="decimal" min="0.01" step="0.01" value="${x?.amount??''}" placeholder="0,00"/></div><div class="formfield"><label for="txnCat">Categoria *</label><select class="select" id="txnCat">${catsFor(type)}</select></div><div class="formfield"><label for="txnTitle">Descrizione *</label><input class="input" required maxlength="90" id="txnTitle" value="${safe(x?.title||'')}" placeholder="Es. Supermercato"/></div><div class="formfield"><label for="txnDate">Data *</label><input class="input" required type="date" id="txnDate" value="${dt}"/></div><div class="formactions" style="grid-column:1/-1"><button type="button" class="btn alt" data-action="close">Annulla</button><button class="btn" type="submit">${x?'Salva modifiche':'Registra movimento'}</button></div></form>`);const cat=document.getElementById('txnCat');if(x?.category&&allCats(type).includes(x.category))cat.value=x.category}
function recModal(x=null){const type=x?.type||'expense';openModal(`${modalHeader(x?'Modifica ricorrenza':'Nuova ricorrenza')}<form id="recForm" data-id="${x?.id||''}" class="formgrid"><div class="formfield"><label>Tipo</label><select id="recType" class="select"><option value="expense" ${type==='expense'?'selected':''}>Uscita</option><option value="income" ${type==='income'?'selected':''}>Entrata</option></select></div><div class="formfield"><label>Importo (€) *</label><input id="recAmount" class="input" type="number" required min="0.01" step="0.01" value="${x?.amount??''}"/></div><div class="formfield"><label>Descrizione *</label><input id="recTitle" class="input" required maxlength="90" value="${safe(x?.title||'')}" placeholder="Es. Affitto"/></div><div class="formfield"><label>Giorno del mese (1–28)</label><input id="recDay" class="input" type="number" required min="1" max="28" value="${x?.day??1}"/></div><div class="formfield"><label>Categoria</label><select class="select" id="recCat">${catsFor(type)}</select></div><div class="formactions" style="grid-column:1/-1"><button class="btn alt" type="button" data-action="close">Annulla</button><button class="btn" type="submit">Salva ricorrenza</button></div></form>`);if(x?.category)document.getElementById('recCat').value=x.category}
function editBudget(mutator){const b=JSON.parse(JSON.stringify(budget()));mutator(b);state.budgetOverrides[state.month]=b;persist();render()}
function download(filename,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function record(rec,x){state.transactions.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,7),...x});if(rec)state.decisions[state.month+'_'+rec]='confirmed';persist();closeModal();render()}
function confirmRec(id,modify=false){const r=state.recurring.find(x=>x.id===id);if(!r)return;if(modify){txnModal({type:r.type,amount:r.amount,title:r.title,category:r.category,date:state.month+'-'+pad(r.day)},id);return}record(id,{type:r.type,amount:Number(r.amount),title:r.title,category:r.category,date:state.month+'-'+pad(r.day),recurringId:id,recurringMonth:state.month})}
function getData(el){return el.dataset}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const a=target.dataset.action,id=target.dataset.id;
 if(a==='closeBackdrop'){if(e.target===target)closeModal();return}if(a==='close'){closeModal();return}
 if(a==='tab'){tab=target.dataset.tab;render();window.scrollTo(0,0)}
 if(a==='add')txnModal();
 if(a==='prevmonth'||a==='nextmonth'){state.month=shiftMonth(state.month,a==='prevmonth'?-1:1);persist();render()}
 if(a==='edit'){txnModal(state.transactions.find(x=>x.id===id))}
 if(a==='delete'){const x=state.transactions.find(t=>t.id===id);if(x&&confirm(`Eliminare definitivamente “${x.title}” (${money(x.amount)})?`)){state.transactions=state.transactions.filter(x=>x.id!==id);if(x.recurringId)delete state.decisions[x.recurringMonth+'_'+x.recurringId];persist();render()}}
 if(a==='confirmrec')confirmRec(id,!!target.dataset.edit);
 if(a==='skiprec'){const r=state.recurring.find(x=>x.id===id);if(r&&confirm(`Saltare “${r.title}” solo per ${monthLabel(state.month)}?`)){state.decisions[state.month+'_'+id]='skipped';persist();render()}}
 if(a==='changeTxnType'){editingType=target.dataset.type;document.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('active',b.dataset.type===editingType));document.getElementById('txnCat').innerHTML=catsFor(editingType)}
 if(a==='savegeneral'){const x=Number(document.getElementById('generalBudget').value);if(!Number.isFinite(x)||x<0)return alert('Inserisci un budget valido.');editBudget(b=>b.general=x)}
 if(a==='savecat'){const c=target.dataset.cat,v=document.querySelector(`[data-limit="${CSS.escape(c)}"]`).value;if(v.trim()===''){editBudget(b=>delete b.cats[c]);return}const n=Number(v);if(!Number.isFinite(n)||n<0)return alert('Inserisci un limite valido.');editBudget(b=>b.cats[c]=n)}
 if(a==='makeDefault'){if(confirm('Applicare il budget del mese selezionato come predefinito per i mesi senza impostazioni personalizzate?')){const b=budget();state.budgetGeneral=b.general;state.budgetCats=JSON.parse(JSON.stringify(b.cats));persist();render();alert('Limiti predefiniti aggiornati.')}}
 if(a==='addcat'){const t=target.dataset.type,n=prompt('Nome della nuova categoria:')?.trim();if(!n)return;if(allCats(t).some(x=>x.toLowerCase()===n.toLowerCase()))return alert('Categoria già esistente.');(t==='income'?state.customIncome:state.customExpense).push(n);persist();render()}
 if(a==='export'){const csv=['Tipo,Data,Descrizione,Categoria,Importo',...state.transactions.map(x=>[x.type,x.date,'"'+x.title.replace(/"/g,'""')+'"','"'+x.category.replace(/"/g,'""')+'"',x.amount].join(','))].join('\r\n');download('bilancio-movimenti.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
 if(a==='exportjson')download('bilancio-backup.json',JSON.stringify(state,null,2),'application/json');
 if(a==='reset'){if(confirm('Eliminare TUTTI i movimenti, budget e impostazioni di questo browser? È irreversibile senza un backup.')){state=base();state.demo=false;state.transactions=[];state.recurring=[];state.decisions={};state.budgetCats={};state.budgetGeneral=0;state.budgetOverrides={};persist();tab='home';render()}}
 if(a==='addrec')recModal();if(a==='editrec')recModal(state.recurring.find(x=>x.id===id));
 if(a==='delrec'){const r=state.recurring.find(x=>x.id===id);if(r&&confirm(`Eliminare la ricorrenza “${r.title}” per i prossimi mesi? Le transazioni già registrate resteranno.`)){state.recurring=state.recurring.filter(x=>x.id!==id);persist();render()}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;applySearch()}});
document.addEventListener('change',async e=>{if(e.target.id==='filter'){filter=e.target.value;applySearch()}if(e.target.id==='recType'){document.getElementById('recCat').innerHTML=catsFor(e.target.value)}if(e.target.id==='importjson'){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.transactions)||!Array.isArray(data.recurring)||typeof data.budgetGeneral!=='number'||typeof data.month!=='string')throw Error('Formato non valido');if(!confirm('Sostituire i dati correnti con quelli del backup?'))return;state={...base(),...data};persist();render();alert('Backup importato.')}catch(err){alert('Impossibile importare il file: '+err.message)}}});
document.addEventListener('submit',e=>{if(e.target.id==='txnForm'){e.preventDefault();const form=e.target,old=form.dataset.id,rec=form.dataset.recid,amt=Number(document.getElementById('txnAmt').value),title=document.getElementById('txnTitle').value.trim(),date=document.getElementById('txnDate').value,category=document.getElementById('txnCat').value;if(!amt||amt<=0||!title||!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Compila correttamente tutti i campi obbligatori.');const x={type:editingType,amount:amt,title,category,date};if(old&&!rec){const item=state.transactions.find(x=>x.id===old);if(!item)return;Object.assign(item,x);persist();closeModal();render()}else{record(rec,x)}}if(e.target.id==='recForm'){e.preventDefault();const id=e.target.dataset.id,dayN=Number(document.getElementById('recDay').value),amt=Number(document.getElementById('recAmount').value);if(dayN<1||dayN>28||amt<=0)return alert('Controlla giorno e importo.');const x={type:document.getElementById('recType').value,amount:amt,day:dayN,title:document.getElementById('recTitle').value.trim(),category:document.getElementById('recCat').value};if(!x.title)return alert('Inserisci una descrizione.');if(id){Object.assign(state.recurring.find(x=>x.id===id),x)}else{state.recurring.push({id:'r'+Date.now(),...x})}persist();closeModal();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
