/* Bilancio v0.2 — approved minimal, colorful mobile dashboard */
:root{--page:#fff;--ink:#101827;--teal:#15803d;--deep:#11753b;--tealbg:#dcfce7;--red:#b91c1c}
body{background:#fff}
.stage{max-width:1050px}
.home-header{background:linear-gradient(120deg,#fff2e9,#fff8f3);border-radius:20px;padding:20px 22px;margin-bottom:20px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.home-heading{display:flex;align-items:center;gap:12px}
.home-heading h1{font-size:27px;margin:0;letter-spacing:-.9px}
.home-mark{display:grid;place-items:center;background:#ff8314;color:white;border-radius:12px;width:38px;height:38px;font-size:23px;font-weight:bold}
.home-period{border:1px solid #f6e5dc;background:#fff;border-radius:999px;padding:10px 14px;color:#283044;font-weight:650;display:flex;gap:10px;align-items:center;font-size:13px;white-space:nowrap;max-width:100%}
.home-period:hover{background:#fff9f4}
.home-balance{border-radius:22px;min-height:166px;background:linear-gradient(115deg,#ffab20 0%,#ff7b12 55%,#ff570d 100%);color:white;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 12px}
.home-balance.is-negative{background:linear-gradient(115deg,#ed7770,#c83339)}
.home-balance>div{font-size:21px;font-weight:750}
.home-balance strong{font-size:clamp(32px,5vw,49px);letter-spacing:-1.5px;line-height:1.12;font-weight:850;overflow-wrap:anywhere}
.home-kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.home-kpi{border-radius:20px;min-height:120px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:16px 8px}
.home-kpi.income{background:linear-gradient(130deg,#ecffed,#b6f5c3);color:#08782a}
.home-kpi.expense{background:linear-gradient(130deg,#ffecee,#ffb5bf);color:#b21b24}
.home-kpi>div{font-size:18px;font-weight:750}
.home-kpi strong{font-size:clamp(19px,3.3vw,30px);font-weight:850;letter-spacing:-.8px;white-space:nowrap}
.home-transactions{margin-top:28px}
.home-transactions h2{font-size:21px;letter-spacing:-.5px;margin:0 0 14px}
.home-movements{border-radius:20px;background:white;box-shadow:0 8px 27px rgba(31,35,44,.08);padding:6px 15px}
.home-movement{display:flex;align-items:center;gap:12px;border-bottom:1px solid #ecedf1;padding:10px 0;min-width:0}
.home-movement:last-child{border:0}
.home-symbol{display:grid;place-items:center;background:#f2edff;border-radius:12px;height:40px;width:40px;font-size:20px;flex:0 0 auto}
.home-movement:nth-child(2n) .home-symbol{background:#e3f0ff}
.home-movement:nth-child(3n) .home-symbol{background:#fff0e1}
.home-movement:nth-child(5n) .home-symbol{background:#ddfae5}
.home-movement-desc{flex:1;min-width:0}
.home-movement-desc strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750;font-size:14px}
.home-movement-desc small{display:block;font-size:12px;color:#8a919e;margin-top:3px}
.home-value{font-size:14px;white-space:nowrap}
.home-value.income{color:#098b36}.home-value.expense{color:#ce2426}
.home-demo{margin:12px 0;font-size:11px;color:#88929f;text-align:center}
.period-presets{display:flex;gap:8px;margin:14px 0}
.period-navigation{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#f8fafc;padding:10px;border-radius:12px;margin:15px 0;font-size:12px;text-align:center}
@media(max-width:720px){.stage{padding:12px 14px 110px}.home-header{padding:16px 15px;gap:10px;margin-bottom:14px}.home-heading h1{font-size:24px}.home-mark{height:33px;width:33px;font-size:20px}.home-period{font-size:12px;padding:9px 12px}.home-balance{min-height:142px;border-radius:19px}.home-balance>div{font-size:20px}.home-balance strong{font-size:41px}.home-kpis{gap:10px;margin-top:10px}.home-kpi{min-height:100px;padding:13px 5px;border-radius:17px}.home-kpi>div{font-size:16px}.home-kpi strong{font-size:clamp(19px,5vw,26px)}.home-transactions{margin-top:23px}.home-transactions h2{font-size:20px}.home-movement{padding:9px 0}.bottomnav{justify-content:space-between;height:calc(74px + env(safe-area-inset-bottom,0px))}.bottomnav button{flex:1;min-width:0;font-size:9px;gap:5px}.bottomnav button.active{color:#f36b0c}.bottomnav .addnav .glyph{background:linear-gradient(130deg,#ff9b20,#ff650e);border-radius:50%;width:47px;height:47px;box-shadow:0 7px 18px rgba(255,103,20,.28);margin-top:-16px;font-size:32px}.period-navigation{flex-wrap:wrap}.period-navigation span{min-width:100%;order:-1}}
@media(max-width:365px){.home-kpi strong{font-size:19px}.home-balance strong{font-size:36px}.home-value{font-size:12px}.home-period{font-size:11px}}

/* Bilancio v0.3 — Movimenti opened from Dashboard */
.home-recent-link{display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:12px}
.home-recent-link span{font-size:26px;color:#f97316;line-height:1}
.home-transactions[role="button"]:focus-visible{outline:3px solid #ff9a37;outline-offset:5px;border-radius:15px}
.mov-back{border:0;background:#fff;color:#ea6c15;border-radius:11px;font-size:28px;width:33px;height:33px;display:grid;place-items:center;line-height:1}
.transactions-page{position:relative;padding-bottom:100px}
.transaction-group-container{display:flex;flex-direction:column;gap:14px;padding-bottom:10px}
.trans-month{background:#fff;border-radius:16px;overflow:hidden}
.trans-month-head{width:100%;border:0;background:#fff;color:#151a27;font-size:19px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;justify-content:space-between;padding:13px 7px 12px;text-align:left;border-bottom:1px solid #e7eaef}
.trans-month-head span:first-child{text-transform:capitalize}
.trans-month-chevron{color:#64748b;font-size:23px}
.trans-items{padding:1px 4px}
.trans-row{border:0;background:white;border-bottom:1px solid #edf0f4;width:100%;display:flex;align-items:center;text-align:left;gap:10px;padding:7px 2px;min-height:54px;cursor:pointer}
.trans-row:last-child{border-bottom:0}
.trans-row:active{background:#fff8f1}
.trans-emoji{font-size:18px;display:grid;place-items:center;flex:0 0 35px;height:35px;border-radius:11px;background:#fff0e7}
.trans-row:nth-child(4n+2) .trans-emoji{background:#e5f1ff}.trans-row:nth-child(4n+3) .trans-emoji{background:#e3fae8}.trans-row:nth-child(4n) .trans-emoji{background:#f1eaff}
.trans-desc{flex:1;min-width:0}
.trans-desc strong{display:block;font-size:13px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trans-desc small{display:block;font-size:11px;color:#8290a0;margin-top:3px}
.trans-amt{font-size:13px;font-weight:800;white-space:nowrap;letter-spacing:-.2px}
.trans-amt.income{color:#10913c}.trans-amt.expense{color:#cc2527}
.trans-bottom-tools{position:sticky;bottom:12px;background:rgba(255,255,255,.96);display:flex;gap:10px;padding:10px 0;z-index:10;align-items:center}
.trans-search{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:#f4f5f7;border-radius:14px;padding:0 12px;height:46px}
.trans-search span{font-size:25px;color:#8190a0}
.trans-search input{border:0;min-width:0;background:transparent;width:100%;outline:none;font-size:14px;color:#121a28}
.trans-filter{width:46px;height:46px;border:0;border-radius:14px;background:#fff0e7;color:#ea6f12;font-size:24px;cursor:pointer}
.trans-filter.selected{background:#ffdfc6}
.filter-holder{position:relative}
.trans-filter-menu{position:absolute;bottom:52px;right:0;min-width:140px;display:flex;flex-direction:column;gap:3px;padding:8px;background:#fff;border:1px solid #f0e5e1;border-radius:12px;box-shadow:0 12px 26px rgba(22,26,33,.15);z-index:30}
.trans-filter-menu button{background:#fff;border:0;text-align:left;border-radius:8px;padding:10px 11px;font-size:13px;color:#324155}
.trans-filter-menu button.chosen{background:#fff1e5;color:#e56c17;font-weight:800}
.trans-empty{padding:26px 12px;text-align:center;color:#8893a1;font-size:13px}
@media(max-width:720px){.transactions-page{padding-bottom:calc(125px + env(safe-area-inset-bottom,0px))}.trans-bottom-tools{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding:8px 14px;background:rgba(255,255,255,.98);border-top:1px solid #eff1f4;z-index:17;box-shadow:0 -6px 16px rgba(50,60,70,.03)}.trans-month-head{font-size:18px;padding:11px 5px 10px}.trans-row{min-height:52px;padding:6px 2px}.trans-desc strong{font-size:13px}.trans-amt{font-size:13px}.movements-header{margin-bottom:10px}}

/* Gestione categorie v0.4 — le etichette sono modificabili, gli ID rimangono stabili. */
.category-manager{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cat-manager-card{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.cat-manager-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cat-manager-head h2{font-size:18px}
.cat-manager-row{border-bottom:1px solid #f0f2f4;padding:11px 0}
.cat-manager-row:last-child{border:0}
.cat-manager-main{display:flex;align-items:center;gap:10px;min-width:0}
.cat-manager-ico{font-size:19px;width:37px;height:37px;background:#fff3e6;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.cat-manager-info{min-width:0;flex:1}
.cat-manager-info b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-manager-info small{display:block;font-size:11px;color:var(--muted);margin-top:3px}

/* Bilancio v0.6 — Selettore mese a rotella e icone coerenti */

.period-wheel{position:relative;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;height:232px;scroll-padding:92px 0;border:1px solid #edf0f3;border-radius:16px;background:#fcfcfd;padding:92px 0;-webkit-overflow-scrolling:touch;touch-action:pan-y}

.period-wheel-col:after{content:'';position:absolute;left:3px;right:3px;top:calc(50% + 12px);height:48px;transform:translateY(-50%);border:1px solid #ffdabd;background:rgba(255,135,40,.10);border-radius:12px;pointer-events:none}

];

const base=()=>({demo:true,themeMode:'auto',month:realMonth,tags:[],statsTagId:null,favorites:[],categoryDefs:DEFAULT_CATEGORY_DEFS.map(x=>({...x,archived:false})),homeRange:{kind:'cycle',start:'2026-11-23',end:'2026-12-22'},transactions:[

 ],decisions:{}});

let tab='home', filter='all', tagFilter='all', search='', editingType='expense';

function persist(){
 try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Non è possibile salvare i dati in questo browser. Esporta un backup e verifica l’archiviazione locale.')}
 if(!cloudApplying&&(cloudReady||(cloudBooted&&readCloudMeta()?.enabled))){
  cloudDirty=true;cloudMutationCount++;

 }

function applyAppearance(){
 const mode=state.themeMode||'auto';

 document.documentElement.style.colorScheme=dark?'dark':'light';
 const meta=document.querySelector('meta[name="theme-color"]');
 if(meta)meta.content=dark?'#141923':'#fff9f4';

const categoryById=id=>state.categoryDefs.find(c=>c.id===id);

const categoryEmoji=id=>{const c=categoryRoot(id);return c?(ROOT_ICONS[c.id]||c.emoji||'◌'):'◌'};

function categoryOptions(type,selectedId=''){
 const roots=state.categoryDefs.filter(c=>c.type===type&&!c.parentId&&(!c.archived||c.id===selectedId||state.categoryDefs.some(s=>s.id===selectedId&&s.parentId===c.id)));
 return roots.map(p=>{
  const children=state.categoryDefs.filter(c=>c.type===type&&c.parentId===p.id&&(!c.archived||c.id===selectedId));
  return `<option value="${safe(p.id)}">${safe(categoryEmoji(p.id))} ${safe(p.name)}</option>`+children.map(c=>`<option value="${safe(c.id)}">　↳ ${safe(c.name)}</option>`).join('');
 }).join('');

function legacyCategoryId(type,name){
 const label=String(name||'Altro').trim();
 const mapped=type==='expense'?({'Ristoranti':'e-ristorazione-ristoranti','Ristorazione':'e-ristorazione'}[label]):({'Extra':'i-lavoro-extra'}[label]);
 if(mapped&&categoryById(mapped))return mapped;
 const direct=state.categoryDefs.find(c=>c.type===type&&!c.parentId&&c.name.toLocaleLowerCase('it-IT')===label.toLocaleLowerCase('it-IT'));
 if(direct)return direct.id;
 const candidate=state.categoryDefs.find(c=>c.type===type&&c.name.toLocaleLowerCase('it-IT')===label.toLocaleLowerCase('it-IT'));
 if(candidate)return candidate.id;
 const id='cat-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
 state.categoryDefs.push({id,type,name:label,parentId:null,emoji:'◌',archived:false});
 return id;
}
function normalizeCategories(){
 if(!Array.isArray(state.categoryDefs))state.categoryDefs=DEFAULT_CATEGORY_DEFS.map(c=>({...c,archived:false}));

 for(const [type,old] of [['expense',state.customExpense],['income',state.customIncome]]){

  if(!categoryById(x.categoryId)||categoryById(x.categoryId).type!==x.type)x.categoryId=legacyCategoryId(x.type,x.category);

 }

function addMonthToDate(start,offset){const [y,m,d]=start.split('-').map(Number);const dt=new Date(y,m-1+offset,1);const day=Math.min(d,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate());return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(day)}
function cycleEnd(start){const next=addMonthToDate(start,1);const d=new Date(next+'T12:00:00');d.setDate(d.getDate()-1);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const ISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(iso,delta)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+delta);return ISO(d)};
const monthStart=month=>month+'-01';
const monthEnd=month=>cycleEnd(monthStart(month));
function currentCycleStart(){const d=now.getDate()>=23?realMonth:shiftMonth(realMonth,-1);return d+'-23'}

function movePeriod(amount){const r=state.homeRange;
 if(r.kind==='cycle'){const start=addMonthToDate(r.start,amount);choosePeriod('cycle',start,cycleEnd(start));return}
 if(r.kind==='calendar'){const m=shiftMonth(r.start.slice(0,7),amount);choosePeriod('calendar',monthStart(m),monthEnd(m));return}
 if(r.kind==='last6'||r.kind==='last12'){const n=r.kind==='last6'?6:12;const start=addMonthToDate(r.start,amount*n),end=addMonthToDate(r.end,amount*n);choosePeriod(r.kind,start,end);return}
 const days=Math.round((new Date(r.end+'T12:00:00')-new Date(r.start+'T12:00:00'))/86400000)+1;
 choosePeriod('custom',addDays(r.start,amount*days),addDays(r.end,amount*days));
}

function categoryBreakdown(type,root=null){const sums=new Map();for(const x of analyticsTransactions().filter(x=>x.type===type)){
 const cat=categoryById(x.categoryId),parent=categoryRoot(x.categoryId);if(!cat||!parent)continue;
 const id=root?(parent.id===root?(cat.parentId?cat.id:root):null):parent.id;
 if(!id)continue;sums.set(id,(sums.get(id)||0)+Number(x.amount));
 }return [...sums.entries()].map(([id,amount])=>({id,amount,name:root&&id===root?'Altre spese':categoryTitle(id),color:root&&id!==root?mixHex(categoryColor(root),'#ffffff',Math.min(.75,.10+([...sums.keys()].indexOf(id)%5)*.14)):categoryColor(id)})).sort((a,b)=>b.amount-a.amount)}
function mixHex(a,b,t){const toRgb=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const x=toRgb(a),y=toRgb(b);return '#'+x.map((v,i)=>Math.round(v*(1-t)+y[i]*t).toString(16).padStart(2,'0')).join('')}
function donutSvg(entries,total,label){const r=64,circ=2*Math.PI*r;let off=0;
 const strokes=total>0?entries.map(x=>{const length=x.amount/total*circ;const stroke=`<circle cx="95" cy="95" r="${r}" fill="none" stroke="${x.color}" stroke-width="25" stroke-dasharray="${Math.max(0,length)} ${circ}" stroke-dashoffset="${-off}" transform="rotate(-90 95 95)"><title>${safe(x.name)}: ${money(x.amount)}</title></circle>`;off+=length;return stroke}).join(''):'';
 return `<svg class="stats-donut" viewBox="0 0 190 190" role="img" aria-label="${safe(label)}: ${money(total)}"><circle cx="95" cy="95" r="${r}" fill="none" stroke="#eff1f4" stroke-width="25"/>${strokes}<text x="95" y="92" text-anchor="middle" class="donut-number">${safe(money(total))}</text><text x="95" y="114" text-anchor="middle" class="donut-label">${safe(label)}</text></svg>`}
function comparisonRanges(){const r=state.homeRange;
 if(r.kind==='last6'||r.kind==='last12'||Math.round((new Date(r.end+'T12:00:00')-new Date(r.start+'T12:00:00'))/86400000)>62){
  const arr=[],start=r.start.slice(0,7),end=r.end.slice(0,7);let m=start,n=0;
  while(m<=end&&n<24){arr.push({start:m===start?r.start:monthStart(m),end:m===end?r.end:monthEnd(m),label:new Date(m+'-01T12:00:00').toLocaleDateString('it-IT',{month:'short'})});m=shiftMonth(m,1);n++}return arr;
 }
 const result=[];
 for(let i=-5;i<=0;i++){
  let s,e;
  if(r.kind==='cycle'){s=addMonthToDate(r.start,i);e=cycleEnd(s)}
  else if(r.kind==='calendar'){const m=shiftMonth(r.start.slice(0,7),i);s=monthStart(m);e=monthEnd(m)}
  else{const days=Math.round((new Date(r.end+'T12:00:00')-new Date(r.start+'T12:00:00'))/86400000)+1;s=addDays(r.start,i*days);e=addDays(r.end,i*days)}
  result.push({start:s,end:e,label:new Date(s+'T12:00:00').toLocaleDateString('it-IT',{month:'short'})});

function linkCloud(row){cloudRevision=row.revision;cloudRemote=row;cloudReady=true;cloudDirty=false;cloudMode='ready';cloudError='';cloudInfo='Sincronizzazione attiva.';saveCloudMeta();showCloud()}
async function getAuthenticatedUser(){if(!sb)return null;const {data,error}=await sb.auth.getUser();if(error)return null;return data.user||null}
async function initCloudUser(){
 if(!sb||cloudConnectionBusy)return;cloudConnectionBusy=true;
 try{
  const user=await getAuthenticatedUser();
  if(!user){cloudUser=null;cloudReady=false;cloudMode='loggedout';cloudError='';return}
  if(cloudUser?.id===user.id&&cloudReady)return;
  cloudUser=user;cloudReady=false;cloudMode='loading';showCloud();
  const row=await fetchCloudRow();cloudRemote=row;
  const meta=readCloudMeta();
  if(row&&meta?.userId===user.id&&meta.enabled&&Number.isInteger(meta.revision)){
   cloudRevision=meta.revision;cloudDirty=!!meta.dirty;
   if(row.revision===cloudRevision){cloudMode='ready';cloudReady=true;if(cloudDirty)scheduleCloudSync()}
   else if(cloudDirty){cloudMode='conflict';cloudReady=false;cloudError='Le modifiche locali non sono state sovrascritte.'}
   else{installCloudState(row.payload);linkCloud(row)}
  }else{cloudMode='setup';cloudInfo='Scegli come iniziare la sincronizzazione.'}
 }catch(e){cloudMode='offline';cloudFail(e)}finally{cloudConnectionBusy=false;showCloud()}
}
async function initSupabaseClient(){
 if(sb)return initCloudUser();
 if(!window.supabase?.createClient){cloudMode='offline';cloudError='Non riesco a caricare la libreria Supabase. Controlla la connessione.';showCloud();return}
 try{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((event)=>{
   if(event==='PASSWORD_RECOVERY'){cloudRecovery=true;tab='settings';setTimeout(()=>render(),0)}
   if(['SIGNED_IN','SIGNED_OUT','TOKEN_REFRESHED','INITIAL_SESSION'].includes(event))setTimeout(()=>{if(event==='SIGNED_OUT'){cloudUser=null;cloudReady=false;cloudMode='loggedout';showCloud()}else initCloudUser().catch(cloudFail)},0)
  });
  await initCloudUser();
 }catch(e){cloudMode='offline';cloudFail(e)}
}
function loadSupabaseLibrary(){

async function syncCloud(){
 if(!cloudReady||!sb||!cloudUser||cloudBusy)return;
 if(!cloudDirty){await checkCloudUpdates();return}
 if(!navigator.onLine){cloudInfo='Offline: sincronizzeremo quando tornerà Internet.';showCloud();return}
 cloudBusy=true;const mutation=cloudMutationCount;const revision=cloudRevision;
 try{
  const {data,error}=await sb.from(CLOUD_TABLE).update({payload:state,revision:revision+1,updated_at:new Date().toISOString()}).eq('user_id',cloudUser.id).eq('revision',revision).select('revision').maybeSingle();
  if(error)throw error;
  if(!data){cloudMode='conflict';cloudReady=false;cloudError='Un altro dispositivo ha già aggiornato il cloud. Scegli quale versione conservare.';return}
  cloudRevision=data.revision;cloudDirty=mutation!==cloudMutationCount;cloudError='';cloudInfo=cloudDirty?'Altre modifiche in attesa.':'Ultima sincronizzazione completata.';saveCloudMeta();
 }catch(e){cloudFail(e)}finally{cloudBusy=false;showCloud();if(cloudReady&&cloudDirty&&navigator.onLine)scheduleCloudSync()}
}
async function checkCloudUpdates(){
 if(!cloudReady||!sb||!cloudUser||cloudBusy||!navigator.onLine)return;
 cloudBusy=true;
 try{
  const remote=await fetchCloudRow();if(!remote){cloudMode='conflict';cloudReady=false;cloudError='Archivio remoto non più disponibile.';return}
  if(remote.revision!==cloudRevision){if(cloudDirty){cloudMode='conflict';cloudReady=false;cloudError='Modifiche simultanee rilevate.'}else{installCloudState(remote.payload);linkCloud(remote)}}
 }catch(e){cloudFail(e)}finally{cloudBusy=false;showCloud()}
}

async function cloudAction(action){
 if(action==='cloudRetry'){cloudError='';if(!sb)loadSupabaseLibrary();else initCloudUser();return}
 if(action==='cloudToggleAuth'){cloudAuthView=cloudAuthView==='signup'?'login':'signup';cloudError='';showCloud();return}
 if(action==='cloudResendConfirmation'){
  if(!sb)throw Error('Connessione Supabase non disponibile.');
  const email=prompt('Inserisci l’indirizzo email dell’account Bilancio da confermare:')?.trim();
  if(!email)return;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Inserisci un indirizzo email valido.');
  const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error)throw error;
  cloudError='';cloudInfo='Richiesta di reinvio inviata. Controlla la casella email e apri solo il link più recente. Se il messaggio arriva in ritardo, il link potrebbe essere già scaduto.';
  showCloud();return;
 }
 if(action==='cloudForgot'){
  if(!sb)return;const email=prompt('Inserisci l’email del tuo account Bilancio:')?.trim();if(!email)return;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
  cloudInfo='Se l’indirizzo è registrato, riceverai un’email per ripristinare la password.';cloudError='';showCloud();return;
 }
 if(action==='cloudLogout'){
  if(cloudDirty){alert('Hai modifiche non sincronizzate. Sincronizzale prima di uscire per non perderle.');return}
  await sb.auth.signOut();cloudUser=null;cloudReady=false;cloudMode='loggedout';cloudError='';localStorage.removeItem(CLOUD_META_KEY);showCloud();return;
 }
 if(!sb||!cloudUser){alert('Accedi prima al tuo account.');return}
 if(action==='cloudSyncNow'){if(cloudReady){if(cloudDirty)await syncCloud();else await checkCloudUpdates()}return}
 if(action==='cloudStartLocal'){
  if(cloudRemote)return alert('Esiste già un archivio cloud. Usa il comando di sostituzione, dopo aver controllato entrambi gli archivi.');
  if(!confirm((state.demo?'Questo dispositivo contiene dati DIMOSTRATIVI. ':'')+'Vuoi salvare sul cloud TUTTI i dati attuali, inclusi categorie, budget e ricorrenze?'))return;
  localCloudBackup();const row=await createCloudRow(state);linkCloud(row);return;
 }
 if(action==='cloudStartEmpty'){
  if(cloudRemote)return alert('L’archivio cloud non è vuoto.');
  if(!confirm('Creare un archivio cloud VUOTO? I dati locali saranno sostituiti dopo aver scaricato un backup.'))return;
  localCloudBackup();const blank=base();Object.assign(blank,{demo:false,month:realMonth,homeRange:{kind:'calendar',start:monthStart(realMonth),end:monthEnd(realMonth)},transactions:[],recurring:[],decisions:{},budgetGeneral:0,budgetCats:{},budgetOverrides:{},tags:[],favorites:[]});
  const row=await createCloudRow(blank);installCloudState(blank);linkCloud(row);return;
 }
 if(action==='cloudUseRemote'){
  const remote=await fetchCloudRow();if(!remote)return alert('Non esiste ancora un archivio cloud.');
  if(!confirm('Vuoi usare i dati cloud? I dati locali saranno sostituiti, ma prima verrà scaricato un backup JSON.'))return;
  localCloudBackup();installCloudState(remote.payload);linkCloud(remote);return;
 }
 if(action==='cloudReplaceRemote'){
  const remote=await fetchCloudRow();if(!remote)return alert('Nessun archivio cloud disponibile.');
  if(!confirm('ATTENZIONE: sostituirai nel cloud tutti i dati esistenti con quelli di questo dispositivo. Vuoi continuare?'))return;
  if(!confirm('Seconda conferma: hai verificato quali dati vuoi conservare?'))return;
  download('bilancio-cloud-prima-di-sostituire.json',JSON.stringify(remote.payload,null,2),'application/json');
  localCloudBackup();
  const {data,error}=await sb.from(CLOUD_TABLE).update({payload:state,revision:remote.revision+1,updated_at:new Date().toISOString()}).eq('user_id',cloudUser.id).eq('revision',remote.revision).select('revision,payload').maybeSingle();
  if(error)throw error;if(!data){cloudMode='conflict';cloudError='Il cloud è cambiato durante la richiesta. Riprova dopo averlo verificato.';showCloud();return}
  linkCloud(data);return;
 }
}
