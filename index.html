/* Bilancio v0.2 — approved minimal, colorful mobile dashboard */
:root{--page:#fff;--ink:#101827;--teal:#15803d;--deep:#11753b;--tealbg:#dcfce7;--red:#b91c1c}
body{background:#fff}
.stage{max-width:1050px}
.home-header{background:linear-gradient(120deg,#fff2e9,#fff8f3);border-radius:20px;padding:20px 22px;margin-bottom:20px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.home-heading{display:flex;align-items:center;gap:12px}
.home-heading h1{font-size:27px;margin:0;letter-spacing:-.9px}
.home-mark{display:grid;place-items:center;background:#ff8314;color:white;border-radius:12px;width:38px;height:38px;font-size:23px;font-weight:bold}
.home-period{border:1px solid #f6e5dc;background:#fff;border-radius:999px;padding:10px 14px;color:#283044;font-weight:650;display:flex;gap:10px;align-items:center;font-size:13px;white-space:nowrap;max-width:100%}
.home-period:hover{background:#fff9f4}
.home-balance{border-radius:22px;min-height:166px;background:linear-gradient(115deg,#ffab20 0%,#ff7b12 55%,#ff570d 100%);color:white;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 12px}
.home-balance.is-negative{background:linear-gradient(115deg,#ed7770,#c83339)}
.home-balance>div{font-size:21px;font-weight:750}
.home-balance strong{font-size:clamp(32px,5vw,49px);letter-spacing:-1.5px;line-height:1.12;font-weight:850;overflow-wrap:anywhere}
.home-kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.home-kpi{border-radius:20px;min-height:120px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:16px 8px}
.home-kpi.income{background:linear-gradient(130deg,#ecffed,#b6f5c3);color:#08782a}
.home-kpi.expense{background:linear-gradient(130deg,#ffecee,#ffb5bf);color:#b21b24}
.home-kpi>div{font-size:18px;font-weight:750}
.home-kpi strong{font-size:clamp(19px,3.3vw,30px);font-weight:850;letter-spacing:-.8px;white-space:nowrap}
.home-transactions{margin-top:28px}
.home-transactions h2{font-size:21px;letter-spacing:-.5px;margin:0 0 14px}
.home-movements{border-radius:20px;background:white;box-shadow:0 8px 27px rgba(31,35,44,.08);padding:6px 15px}
.home-movement{display:flex;align-items:center;gap:12px;border-bottom:1px solid #ecedf1;padding:10px 0;min-width:0}
.home-movement:last-child{border:0}
.home-symbol{display:grid;place-items:center;background:#f2edff;border-radius:12px;height:40px;width:40px;font-size:20px;flex:0 0 auto}
.home-movement:nth-child(2n) .home-symbol{background:#e3f0ff}
.home-movement:nth-child(3n) .home-symbol{background:#fff0e1}
.home-movement:nth-child(5n) .home-symbol{background:#ddfae5}
.home-movement-desc{flex:1;min-width:0}
.home-movement-desc strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750;font-size:14px}
.home-movement-desc small{display:block;font-size:12px;color:#8a919e;margin-top:3px}
.home-value{font-size:14px;white-space:nowrap}
.home-value.income{color:#098b36}.home-value.expense{color:#ce2426}
.home-demo{margin:12px 0;font-size:11px;color:#88929f;text-align:center}
.period-presets{display:flex;gap:8px;margin:14px 0}
.period-navigation{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#f8fafc;padding:10px;border-radius:12px;margin:15px 0;font-size:12px;text-align:center}
@media(max-width:720px){.stage{padding:12px 14px 110px}.home-header{padding:16px 15px;gap:10px;margin-bottom:14px}.home-heading h1{font-size:24px}.home-mark{height:33px;width:33px;font-size:20px}.home-period{font-size:12px;padding:9px 12px}.home-balance{min-height:142px;border-radius:19px}.home-balance>div{font-size:20px}.home-balance strong{font-size:41px}.home-kpis{gap:10px;margin-top:10px}.home-kpi{min-height:100px;padding:13px 5px;border-radius:17px}.home-kpi>div{font-size:16px}.home-kpi strong{font-size:clamp(19px,5vw,26px)}.home-transactions{margin-top:23px}.home-transactions h2{font-size:20px}.home-movement{padding:9px 0}.bottomnav{justify-content:space-between;height:calc(74px + env(safe-area-inset-bottom,0px))}.bottomnav button{flex:1;min-width:0;font-size:9px;gap:5px}.bottomnav button.active{color:#f36b0c}.bottomnav .addnav .glyph{background:linear-gradient(130deg,#ff9b20,#ff650e);border-radius:50%;width:47px;height:47px;box-shadow:0 7px 18px rgba(255,103,20,.28);margin-top:-16px;font-size:32px}.period-navigation{flex-wrap:wrap}.period-navigation span{min-width:100%;order:-1}}
@media(max-width:365px){.home-kpi strong{font-size:19px}.home-balance strong{font-size:36px}.home-value{font-size:12px}.home-period{font-size:11px}}

/* Bilancio v0.3 — Movimenti opened from Dashboard */
.home-recent-link{display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:12px}
.home-recent-link span{font-size:26px;color:#f97316;line-height:1}
.home-transactions[role="button"]:focus-visible{outline:3px solid #ff9a37;outline-offset:5px;border-radius:15px}
.mov-back{border:0;background:#fff;color:#ea6c15;border-radius:11px;font-size:28px;width:33px;height:33px;display:grid;place-items:center;line-height:1}
.transactions-page{position:relative;padding-bottom:100px}
.transaction-group-container{display:flex;flex-direction:column;gap:14px;padding-bottom:10px}
.trans-month{background:#fff;border-radius:16px;overflow:hidden}
.trans-month-head{width:100%;border:0;background:#fff;color:#151a27;font-size:19px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;justify-content:space-between;padding:13px 7px 12px;text-align:left;border-bottom:1px solid #e7eaef}
.trans-month-head span:first-child{text-transform:capitalize}
.trans-month-chevron{color:#64748b;font-size:23px}
.trans-items{padding:1px 4px}
.trans-row{border:0;background:white;border-bottom:1px solid #edf0f4;width:100%;display:flex;align-items:center;text-align:left;gap:10px;padding:7px 2px;min-height:54px;cursor:pointer}
.trans-row:last-child{border-bottom:0}
.trans-row:active{background:#fff8f1}
.trans-emoji{font-size:18px;display:grid;place-items:center;flex:0 0 35px;height:35px;border-radius:11px;background:#fff0e7}
.trans-row:nth-child(4n+2) .trans-emoji{background:#e5f1ff}.trans-row:nth-child(4n+3) .trans-emoji{background:#e3fae8}.trans-row:nth-child(4n) .trans-emoji{background:#f1eaff}
.trans-desc{flex:1;min-width:0}
.trans-desc strong{display:block;font-size:13px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trans-desc small{display:block;font-size:11px;color:#8290a0;margin-top:3px}
.trans-amt{font-size:13px;font-weight:800;white-space:nowrap;letter-spacing:-.2px}
.trans-amt.income{color:#10913c}.trans-amt.expense{color:#cc2527}
.trans-bottom-tools{position:sticky;bottom:12px;background:rgba(255,255,255,.96);display:flex;gap:10px;padding:10px 0;z-index:10;align-items:center}
.trans-search{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:#f4f5f7;border-radius:14px;padding:0 12px;height:46px}
.trans-search span{font-size:25px;color:#8190a0}
.trans-search input{border:0;min-width:0;background:transparent;width:100%;outline:none;font-size:14px;color:#121a28}
.trans-filter{width:46px;height:46px;border:0;border-radius:14px;background:#fff0e7;color:#ea6f12;font-size:24px;cursor:pointer}
.trans-filter.selected{background:#ffdfc6}
.filter-holder{position:relative}
.trans-filter-menu{position:absolute;bottom:52px;right:0;min-width:140px;display:flex;flex-direction:column;gap:3px;padding:8px;background:#fff;border:1px solid #f0e5e1;border-radius:12px;box-shadow:0 12px 26px rgba(22,26,33,.15);z-index:30}
.trans-filter-menu button{background:#fff;border:0;text-align:left;border-radius:8px;padding:10px 11px;font-size:13px;color:#324155}
.trans-filter-menu button.chosen{background:#fff1e5;color:#e56c17;font-weight:800}
.trans-empty{padding:26px 12px;text-align:center;color:#8893a1;font-size:13px}
@media(max-width:720px){.transactions-page{padding-bottom:calc(125px + env(safe-area-inset-bottom,0px))}.trans-bottom-tools{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding:8px 14px;background:rgba(255,255,255,.98);border-top:1px solid #eff1f4;z-index:17;box-shadow:0 -6px 16px rgba(50,60,70,.03)}.trans-month-head{font-size:18px;padding:11px 5px 10px}.trans-row{min-height:52px;padding:6px 2px}.trans-desc strong{font-size:13px}.trans-amt{font-size:13px}.movements-header{margin-bottom:10px}}

/* Gestione categorie v0.4 — le etichette sono modificabili, gli ID rimangono stabili. */
.category-manager{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cat-manager-card{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.cat-manager-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cat-manager-head h2{font-size:18px}
.cat-manager-row{border-bottom:1px solid #f0f2f4;padding:11px 0}
.cat-manager-row:last-child{border:0}
.cat-manager-main{display:flex;align-items:center;gap:10px;min-width:0}
.cat-manager-ico{font-size:19px;width:37px;height:37px;background:#fff3e6;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.cat-manager-info{min-width:0;flex:1}
.cat-manager-info b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-manager-info small{display:block;font-size:11px;color:var(--muted);margin-top:3px}

<body>
<div class="app">
 <aside class="sidebar"><div class="brand"><span class="brandlogo">◈</span> Bilancio</div><nav id="sidenav"></nav><div class="sidefoot">🔒 <b>Prototipo locale</b><br/>I dati rimangono in questo browser. Non c'è ancora sincronizzazione tra dispositivi.</div></aside>
 <main class="stage"><div id="top"></div><div id="view"></div></main>
</div>

<div id="modalroot"></div>
<script>
(() => {"use strict";
const KEY='bilancio-demo-v1';
const now=new Date(); const pad=n=>String(n).padStart(2,'0');
const realMonth=now.getFullYear()+'-'+pad(now.getMonth()+1);
const day=(n,m=realMonth)=>m+'-'+pad(n);
const DEFAULT_CATEGORY_DEFS=[
 {id:'e-casa',type:'expense',name:'Casa',parentId:null,emoji:'⌂'},
 {id:'e-casa-affitto',type:'expense',name:'Affitto',parentId:'e-casa'},
 {id:'e-casa-bollette',type:'expense',name:'Bollette',parentId:'e-casa'},
 {id:'e-casa-spese-varie',type:'expense',name:'Spese varie',parentId:'e-casa'},
 {id:'e-alimentari',type:'expense',name:'Alimentari',parentId:null,emoji:'🛒'},
 {id:'e-alimentari-supermercato',type:'expense',name:'Supermercato',parentId:'e-alimentari'},
 {id:'e-alimentari-piccoli-acquisti',type:'expense',name:'Piccoli acquisti',parentId:'e-alimentari'},
 {id:'e-alimentari-negozi',type:'expense',name:'Negozi',parentId:'e-alimentari'},
 {id:'e-ristorazione',type:'expense',name:'Ristorazione',parentId:null,emoji:'🍽️'},
 {id:'e-ristorazione-ristoranti',type:'expense',name:'Ristoranti',parentId:'e-ristorazione'},
 {id:'e-ristorazione-bar',type:'expense',name:'Bar',parentId:'e-ristorazione'},
 {id:'e-ristorazione-pizzeria',type:'expense',name:'Pizzeria',parentId:'e-ristorazione'},
 {id:'e-ristorazione-altro',type:'expense',name:'Altro',parentId:'e-ristorazione'},
 {id:'e-trasporti',type:'expense',name:'Trasporti',parentId:null,emoji:'🚗'},
 {id:'e-trasporti-mezzi-pubblici',type:'expense',name:'Mezzi pubblici',parentId:'e-trasporti'},
 {id:'e-trasporti-treni',type:'expense',name:'Treni',parentId:'e-trasporti'},
 {id:'e-trasporti-aerei',type:'expense',name:'Aerei',parentId:'e-trasporti'},
 {id:'e-trasporti-benzina',type:'expense',name:'Benzina',parentId:'e-trasporti'},
 {id:'e-abbonamenti',type:'expense',name:'Abbonamenti',parentId:null,emoji:'🎵'},
 {id:'e-shopping',type:'expense',name:'Shopping',parentId:null,emoji:'🛍️'},
 {id:'e-salute',type:'expense',name:'Salute',parentId:null,emoji:'✚'},
 {id:'e-cura',type:'expense',name:'Cura personale',parentId:null,emoji:'🧴'},
 {id:'e-svago',type:'expense',name:'Svago',parentId:null,emoji:'🎟️'},
 {id:'e-altro',type:'expense',name:'Altro',parentId:null,emoji:'◌'},
 {id:'i-stipendio',type:'income',name:'Stipendio',parentId:null,emoji:'💼'},
 {id:'i-lavoro-extra',type:'income',name:'Lavoro extra',parentId:null,emoji:'✦'},
 {id:'i-rimborsi',type:'income',name:'Rimborsi',parentId:null,emoji:'↩'},
 {id:'i-regali',type:'income',name:'Regali',parentId:null,emoji:'🎁'},
 {id:'i-altro',type:'income',name:'Altro',parentId:null,emoji:'◌'}
];
const money=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const safe=str=>String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDate=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
const monthLabel=m=>new Date(m+'-01T12:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
const base=()=>({demo:true,month:realMonth,categoryDefs:DEFAULT_CATEGORY_DEFS.map(x=>({...x,archived:false})),homeRange:{kind:'cycle',start:'2026-11-23',end:'2026-12-22'},transactions:[
 {id:'t1',type:'income',amount:1750,category:'Stipendio',title:'Stipendio',date:'2026-12-18'},
 {id:'t2',type:'expense',amount:500,category:'Casa',title:'Affitto',date:'2026-11-23'},
 {id:'t3',type:'expense',amount:170,category:'Alimentari',title:'Spesa settimanale',date:'2026-12-04'},
 {id:'t4',type:'expense',amount:70,category:'Trasporti',title:'Carburante',date:'2026-12-08'},
 {id:'t5',type:'expense',amount:95,category:'Ristoranti',title:'Cena fuori',date:'2026-12-12'},
 {id:'t6',type:'expense',amount:15,category:'Abbonamenti',title:'Streaming',date:'2026-12-15'}
 ],budgetGeneral:1200,budgetCats:{Alimentari:250,Trasporti:120,Svago:100},budgetOverrides:{},customExpense:[],customIncome:[],recurring:[
 {id:'r1',type:'income',title:'Rimborso spese',amount:50,category:'Rimborsi',day:27},
 {id:'r2',type:'expense',title:'Abbonamento musica',amount:10.99,category:'Abbonamenti',day:15}
 ],decisions:{}});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||base()}catch{state=base()}
let tab='home', filter='all', search='', editingType='expense';
let filterMenuOpen=false; const collapsedMonths=new Set();
if(!state.homeRange||!state.homeRange.start||!state.homeRange.end)state.homeRange={kind:'cycle',start:'2026-11-23',end:'2026-12-22'};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Non è possibile salvare i dati in questo browser. Esporta un backup e verifica l’archiviazione locale.')}};
const categoryById=id=>state.categoryDefs.find(c=>c.id===id);
const categoryTitle=id=>categoryById(id)?.name||'Categoria non disponibile';
const categoryRoot=id=>{const c=categoryById(id);return c?(c.parentId?categoryById(c.parentId)||c:c):null};
const categoryEmoji=id=>categoryRoot(id)?.emoji||'◌';
const categoryPath=id=>{const c=categoryById(id);if(!c)return 'Non classificato';const p=c.parentId?categoryById(c.parentId):null;return p?p.name+' → '+c.name:c.name};
const topCategories=type=>state.categoryDefs.filter(c=>c.type===type&&!c.parentId&&!c.archived);
const directSubcategories=id=>state.categoryDefs.filter(c=>c.parentId===id&&!c.archived);
function categoryOptions(type,selectedId=''){
 const roots=state.categoryDefs.filter(c=>c.type===type&&!c.parentId&&(!c.archived||c.id===selectedId||state.categoryDefs.some(s=>s.id===selectedId&&s.parentId===c.id)));
 return roots.map(p=>{
  const children=state.categoryDefs.filter(c=>c.type===type&&c.parentId===p.id&&(!c.archived||c.id===selectedId));
  return `<option value="${safe(p.id)}">${safe(p.name)}</option>`+children.map(c=>`<option value="${safe(c.id)}">　↳ ${safe(p.name)} / ${safe(c.name)}</option>`).join('');
 }).join('');
}
function legacyCategoryId(type,name){
 const label=String(name||'Altro').trim();
 const mapped=type==='expense'?({'Ristoranti':'e-ristorazione-ristoranti','Ristorazione':'e-ristorazione'}[label]):({'Extra':'i-lavoro-extra'}[label]);
 if(mapped&&categoryById(mapped))return mapped;
 const direct=state.categoryDefs.find(c=>c.type===type&&!c.parentId&&c.name.toLocaleLowerCase('it-IT')===label.toLocaleLowerCase('it-IT'));
 if(direct)return direct.id;
 const candidate=state.categoryDefs.find(c=>c.type===type&&c.name.toLocaleLowerCase('it-IT')===label.toLocaleLowerCase('it-IT'));
 if(candidate)return candidate.id;
 const id='cat-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
 state.categoryDefs.push({id,type,name:label,parentId:null,emoji:'◌',archived:false});
 return id;
}
function normalizeCategories(){
 if(!Array.isArray(state.categoryDefs))state.categoryDefs=DEFAULT_CATEGORY_DEFS.map(c=>({...c,archived:false}));
 state.categoryDefs=state.categoryDefs.filter(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&(c.type==='income'||c.type==='expense')).map(c=>({...c,parentId:c.parentId||null,archived:!!c.archived}));
 for(const [type,old] of [['expense',state.customExpense],['income',state.customIncome]]){
  for(const name of Array.isArray(old)?old:[])legacyCategoryId(type,name);
 }
 for(const x of [...state.transactions,...state.recurring]){
  if(!categoryById(x.categoryId)||categoryById(x.categoryId).type!==x.type)x.categoryId=legacyCategoryId(x.type,x.category);
  x.category=categoryTitle(x.categoryId); // legacy snapshot; categoryId is authoritative from v0.4 onward
 }
 const fixBudget=obj=>{
  if(!obj||typeof obj!=='object')return;
  if(!obj.cats||typeof obj.cats!=='object')obj.cats={};
  const mapped={};for(const [key,v] of Object.entries(obj.cats)){
   const id=categoryById(key)?.id||legacyCategoryId('expense',key);
   const root=categoryRoot(id)?.id||id;
   // A category budget is always at the parent level.
   mapped[root]=Number(v);
  }obj.cats=mapped;
 };
 if(!state.budgetCats||typeof state.budgetCats!=='object')state.budgetCats={};
 const b={cats:state.budgetCats};fixBudget(b);state.budgetCats=b.cats;
 if(!state.budgetOverrides||typeof state.budgetOverrides!=='object')state.budgetOverrides={};
 for(const v of Object.values(state.budgetOverrides))fixBudget(v);
}
// Before the first conversion, keep a raw local snapshot for emergency recovery.
if(!Array.isArray(state.categoryDefs)){
 try{const current=localStorage.getItem(KEY);if(current&&!localStorage.getItem(KEY+'-pre-v04'))localStorage.setItem(KEY+'-pre-v04',current)}catch{}
}
normalizeCategories();persist();
const allCats=type=>topCategories(type).map(c=>c.id);
const catsFor=(type,selectedId='')=>categoryOptions(type,selectedId);
const selected=()=>state.transactions.filter(x=>x.date.startsWith(state.month));
const totals=(m=state.month)=>{const arr=state.transactions.filter(x=>x.date.startsWith(m));return {income:arr.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),expense:arr.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0)}};
const budget=()=>state.budgetOverrides[state.month]||{general:state.budgetGeneral,cats:state.budgetCats};
const byCat=()=>{let obj={};selected().filter(x=>x.type==='expense').forEach(x=>(()=>{const root=categoryRoot(x.categoryId)?.id||x.categoryId;obj[root]=(obj[root]||0)+Number(x.amount)})());return obj};
const href='#';
const nav=[['home','⌂','Dashboard'],['analytics','▥','Statistiche'],['budget','◉','Budget'],['settings','⚙','Impostazioni']];
const getRecurringPending=()=>state.recurring.filter(x=>!state.decisions[state.month+'_'+x.id]);
function render(){
 document.getElementById('sidenav').innerHTML=nav.map(([k,i,t])=>`<button class="navitem ${(tab===k||(tab==='transactions'&&k==='home'))?'active':''}" data-action="tab" data-tab="${k}"><span class="glyph">${i}</span>${t}</button>`).join('');
 document.getElementById('bottomnav').innerHTML=`${bottom('home','⌂','Dashboard')}${bottom('analytics','▥','Statistiche')}<button class="addnav" data-action="add" title="Aggiungi movimento" aria-label="Aggiungi movimento"><span class="glyph">+</span></button>${bottom('budget','◉','Budget')}${bottom('settings','⚙','Impostazioni')}`;
 const labels={home:'Panoramica',transactions:'Movimenti',analytics:'Statistiche',budget:'Budget',settings:'Impostazioni',categories:'Categorie'};
  document.getElementById('top').innerHTML=(tab==='categories')?'':(tab==='home'||tab==='transactions')?
   `<header class="home-header ${tab==='transactions'?'movements-header':''}"><div class="home-heading">${tab==='transactions'?'<button class="mov-back" data-action="goHome" aria-label="Torna alla Dashboard">‹</button>':'<span class="home-mark" aria-hidden="true">▥</span>'}<h1>${tab==='home'?'Dashboard':'Movimenti'}</h1></div><button class="home-period" data-action="period" title="Cambia periodo" aria-label="Cambia il periodo"><span aria-hidden="true">▣</span><span>${shortDate(state.homeRange.start)} – ${shortDate(state.homeRange.end)}</span><span aria-hidden="true">⌄</span></button></header>`:
   `<div class="topline"><div><h1>${labels[tab]}</h1></div><div class="controls"><div class="monthnav"><button title="Mese precedente" data-action="prevmonth">‹</button><strong>${safe(monthLabel(state.month))}</strong><button title="Mese successivo" data-action="nextmonth">›</button></div><button class="btn" data-action="add">+ Nuovo movimento</button></div></div>`;
 const renderer={home:renderHome,transactions:renderTransactions,analytics:renderAnalytics,budget:renderBudget,settings:renderSettings,categories:renderCategoryManager};
 document.getElementById('view').innerHTML=renderer[tab]();
 if(tab==='transactions')updateTransactionList();
}
function bottom(k,i,t){return `<button class="${(tab===k||(tab==='transactions'&&k==='home'))?'active':''}" data-action="tab" data-tab="${k}"><span class="glyph">${i}</span>${t}</button>`}
function mrow(x,editable=false){return `<div class="movement"><div class="symbol">${categoryEmoji(x.categoryId)}</div><div class="middle"><strong>${safe(x.title||x.category)}</strong><small>${safe(categoryPath(x.categoryId))} · ${formatDate(x.date)}</small></div><div class="right ${x.type==='income'?'positive':''}">${x.type==='income'?'+':'−'} ${money(x.amount)}</div>${editable?`<div class="actions"><button class="iconbtn" title="Modifica" data-action="edit" data-id="${safe(x.id)}">✎</button><button class="iconbtn" title="Elimina" data-action="delete" data-id="${safe(x.id)}">×</button></div>`:''}</div>`}
function progress(used,max){const p=max>0?used/max*100:0;return `<div class="barouter"><div class="barfill ${p>100?'over':p>=85?'warn':''}" style="width:${Math.min(100,p).toFixed(2)}%"></div></div>`}
// The dashboard date range is inclusive and independent of the calendar-month views.
const homeSelected=()=>state.transactions.filter(x=>x.date>=state.homeRange.start && x.date<=state.homeRange.end);
const shortDate=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
function homeRow(x){return `<div class="home-movement"><div class="home-symbol" aria-hidden="true">${categoryEmoji(x.categoryId)}</div><div class="home-movement-desc"><strong>${safe(x.title||x.category)}</strong><small>${shortDate(x.date)}</small></div><strong class="home-value ${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'−'}${money(x.amount)}</strong></div>`}
function renderHome(){const arr=homeSelected().sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));const income=arr.filter(x=>x.type==='income').reduce((v,x)=>v+Number(x.amount),0);const expense=arr.filter(x=>x.type==='expense').reduce((v,x)=>v+Number(x.amount),0);const saving=income-expense;return `
 <section class="home-balance ${saving<0?'is-negative':''}" aria-label="Saldo del periodo"><div>Saldo</div><strong>${money(saving)}</strong></section>
 <section class="home-kpis" aria-label="Entrate e uscite nel periodo"><div class="home-kpi income"><div>Entrate</div><strong>${money(income)}</strong></div><div class="home-kpi expense"><div>Uscite</div><strong>${money(expense)}</strong></div></section>
 <section class="home-transactions" data-action="openMovements" role="button" tabindex="0" aria-label="Apri tutti i movimenti"><h2 class="home-recent-link">Ultimi movimenti <span aria-hidden="true">›</span></h2><div class="home-movements">${arr.length?arr.slice(0,5).map(homeRow).join(''):'<div class="emptystate">Nessun movimento in questo periodo.<br/>Tocca + per aggiungerne uno.</div>'}</div></section>
 ${state.demo?'<div class="home-demo">Dati dimostrativi · Le modifiche si salvano solo su questo dispositivo.</div>':''}
 `}
function addMonthToDate(start,offset){const [y,m,d]=start.split('-').map(Number);const dt=new Date(y,m-1+offset,1);const day=Math.min(d,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate());return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(day)}
function cycleEnd(start){const next=addMonthToDate(start,1);const d=new Date(next+'T12:00:00');d.setDate(d.getDate()-1);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function periodModal(){const r=state.homeRange;openModal(`${modalHeader('Seleziona periodo')}<p class="notice">Dashboard e Movimenti mostrano le operazioni comprese nelle date selezionate.</p><div class="period-presets"><button class="btn ${r.kind==='cycle'?'':'alt'} small" data-action="periodCycle">23 → 22</button><button class="btn ${r.kind==='calendar'?'':'alt'} small" data-action="periodCalendar">Mese solare</button></div><div class="period-navigation"><button class="btn alt small" data-action="periodPrevious">← Precedente</button><span>${shortDate(r.start)} – ${shortDate(r.end)}</span><button class="btn alt small" data-action="periodNext">Successivo →</button></div><form id="periodForm"><div class="formgrid"><div class="formfield"><label for="periodStart">Dal giorno (incluso)</label><input id="periodStart" class="input" type="date" required value="${r.start}"/></div><div class="formfield"><label for="periodEnd">Al giorno (incluso)</label><input id="periodEnd" class="input" type="date" required value="${r.end}"/></div></div><div class="formactions"><button type="button" class="btn alt" data-action="close">Annulla</button><button type="submit" class="btn">Applica periodo</button></div></form>`)}
function changePeriod(kind,start,end){state.homeRange={kind,start,end};persist();render();periodModal()}
function movePeriod(amount){const r=state.homeRange;if(r.kind==='cycle'){const start=addMonthToDate(r.start,amount);changePeriod('cycle',start,cycleEnd(start));return}if(r.kind==='calendar'){const start=addMonthToDate(r.start,amount);changePeriod('calendar',start,cycleEnd(start));return}const a=new Date(r.start+'T12:00:00'),b=new Date(r.end+'T12:00:00');const days=Math.round((b-a)/86400000)+1;a.setDate(a.getDate()+amount*days);b.setDate(b.getDate()+amount*days);const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());changePeriod('custom',iso(a),iso(b))}
function transactionRows(){
 const {start,end}=state.homeRange;
 const query=search.trim().toLocaleLowerCase('it-IT');
 return state.transactions.filter(x=>x.date>=start&&x.date<=end)
   .filter(x=>(filter==='all'||x.type===filter)&&(!query||(x.title+' '+categoryPath(x.categoryId)+' '+x.date).toLocaleLowerCase('it-IT').includes(query)))
   .sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
}
function renderTransactionGroups(){
 const arr=transactionRows();
 if(!arr.length)return '<div class="trans-empty">Nessun movimento per questo periodo o filtro.</div>';
 const groups=new Map();
 for(const x of arr){const key=x.date.slice(0,7);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}
 return [...groups.entries()].map(([key,items])=>{
  const collapsed=collapsedMonths.has(key);
  return `<section class="trans-month"><button class="trans-month-head" data-action="toggleMonth" data-month="${key}" aria-expanded="${!collapsed}" aria-label="${collapsed?'Espandi':'Comprimi'} ${safe(monthLabel(key))}"><span>${safe(monthLabel(key))}</span><span class="trans-month-chevron" aria-hidden="true">${collapsed?'⌄':'⌃'}</span></button>${collapsed?'':`<div class="trans-items">${items.map(x=>`<button class="trans-row" data-action="edit" data-id="${safe(x.id)}" aria-label="Modifica ${safe(x.title)}, ${formatDate(x.date)}, ${money(x.amount)}"><span class="trans-emoji" aria-hidden="true">${categoryEmoji(x.categoryId)}</span><span class="trans-desc"><strong>${safe(x.title||x.category)}</strong><small>${formatDate(x.date)}</small></span><span class="trans-amt ${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'−'}${money(x.amount)}</span></button>`).join('')}</div>`}</section>`
 }).join('');
}
function renderTransactions(){
 return `<div class="transactions-page"><div id="movementlist" class="transaction-group-container"></div><div class="trans-bottom-tools"><label class="trans-search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="Cerca movimento..." value="${safe(search)}" aria-label="Cerca movimento" autocomplete="off"></label><div class="filter-holder"><button class="trans-filter ${filter!=='all'?'selected':''}" data-action="toggleFilter" title="Filtra movimenti" aria-expanded="${filterMenuOpen}" aria-label="Filtra movimenti">${filter==='all'?'⚲':filter==='income'?'↙':'↗'}</button>${filterMenuOpen?`<div class="trans-filter-menu" role="group" aria-label="Tipo di movimento"><button data-action="setFilter" data-filter="all" class="${filter==='all'?'chosen':''}">Tutti</button><button data-action="setFilter" data-filter="income" class="${filter==='income'?'chosen':''}">Entrate</button><button data-action="setFilter" data-filter="expense" class="${filter==='expense'?'chosen':''}">Uscite</button></div>`:''}</div></div></div>`;
